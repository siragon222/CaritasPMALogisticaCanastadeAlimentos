<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Inventario de logística Cáritas Diocesana Guasdualito y PMA">
  <title>Inventario de Logística - Cáritas Diocesana Guasdualito y PMA</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>Cáritas Diocesana</h1>
        </div>
        <button class="icon-btn" id="themeToggleBtn" type="button">
          <span id="themeIcon">🌙</span>
          <span id="themeText">Modo Oscuro</span>
        </button>
      </div>
    </header>

    <section class="info-card">
      <h2>Detalles de Logística</h2>
      <p><strong>Encargado de Logística:</strong> Ronald de Jesús Niño Panza</p>
      <p><strong>Instituciones Aliadas:</strong> Cáritas Diocesana Guasdualito • PMA (Programa Mundial de Alimentos)</p>
    </section>

    <div class="toolbar">
      <nav class="month-tabs" id="monthTabs" aria-label="Meses"></nav>
      <input class="search" id="globalSearch" type="search" placeholder="Buscar por comunidad (ej. 5 de Julio, Sinaí) o fecha..." autocomplete="off">
    </div>

    <main id="monthView"></main>
  </div>

  <div class="overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="modalClose" type="button" aria-label="Cerrar">×</button>
      <h3 id="modalTitle"></h3>
      <div id="modalStats"></div>
      <a class="waybill" id="modalWaybill" href="#" target="_blank" rel="noopener">Descargar Waybill</a>
    </div>
  </div>

  <button class="top" id="scrollTopBtn" type="button" aria-label="Volver arriba">▲</button>
  <footer>Cáritas Diocesana Guasdualito © 2026 • Sistema de Control Logístico</footer>

  <script src="meses/agosto.js"></script>
  <script src="meses/septiembre.js"></script>
  <script src="meses/octubre.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
